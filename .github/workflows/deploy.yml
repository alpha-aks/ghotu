name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Install LFTP
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Deploy to Hostinger via LFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 -c '
          import os, sys, ssl, textwrap
          from ftplib import FTP, FTP_TLS

          server = os.environ.get("FTP_SERVER", "")
          user = os.environ.get("FTP_USERNAME", "")
          password = os.environ.get("FTP_PASSWORD", "")

          for prefix in ["ftps://", "ftp://"]:
              if server.startswith(prefix):
                  server = server[len(prefix):]

          safe_user = user.replace("\\", "\\\\").replace("\"", "\\\"")
          safe_password = password.replace("\\", "\\\\").replace("\"", "\\\"")

          target_dir = "."
          try:
              ctx = ssl.create_default_context()
              ctx.check_hostname = False
              ctx.verify_mode = ssl.CERT_NONE

              ftp = None
              try:
                  ftp = FTP_TLS(context=ctx, timeout=30)
                  ftp.connect(server, 21)
                  ftp.login(user, password)
                  ftp.prot_p()
                  ftp.set_pasv(True)
              except Exception:
                  ftp = FTP(timeout=30)
                  ftp.connect(server, 21)
                  ftp.login(user, password)
                  ftp.set_pasv(True)

              pwd = ftp.pwd()
              items = ftp.nlst()
              print(f"[FTP Inspect] Connected successfully.")
              print(f"[FTP Inspect] Remote working directory: {pwd}")
              print(f"[FTP Inspect] Remote items found: {items}")

              # Case 1: public_html exists as a subfolder
              if any(i.strip().rstrip("/").endswith("public_html") or i.strip() == "public_html" for i in items):
                  target_dir = "public_html"
                  print("[FTP Inspect] Detected '\''public_html'\'' folder -> target_dir = public_html")
              # Case 2: domains folder exists (Hostinger multi-domain root)
              elif any(i.strip() == "domains" for i in items):
                  try:
                      ftp.cwd("domains")
                      domains = ftp.nlst()
                      print(f"[FTP Inspect] Domains found: {domains}")
                      for d in domains:
                          d_name = d.strip().rstrip("/")
                          try:
                              ftp.cwd(f"/domains/{d_name}/public_html")
                              target_dir = f"domains/{d_name}/public_html"
                              print(f"[FTP Inspect] Found website public_html -> target_dir = {target_dir}")
                              break
                          except Exception:
                              pass
                  except Exception as e:
                      print(f"[FTP Inspect] Could not traverse domains: {e}")
              else:
                  # Case 3: Already chrooted inside public_html
                  target_dir = "."
                  print("[FTP Inspect] No '\''public_html'\'' subfolder found. This FTP account is already chrooted directly to public_html -> target_dir = .")

              ftp.quit()
          except Exception as e:
              print(f"[FTP Inspect] Note: Automatic directory inspection skipped ({e}). Defaulting to target_dir = .")
              target_dir = "."

          cd_command = f"cd {target_dir}" if target_dir != "." else "pwd"

          script = textwrap.dedent(f"""\
          set cmd:fail-exit true
          set ftp:ssl-allow true
          set ssl:verify-certificate no
          set net:timeout 60
          set net:max-retries 10
          set net:reconnect-interval-base 3
          set ftp:passive-mode true
          set ftp:list-options -a
          open -u "{safe_user}","{safe_password}" "{server}"
          {cd_command}
          mirror --reverse --verbose --only-newer --parallel=3 ./dist .
          bye
          """)

          with open("deploy.lftp", "w") as f:
              f.write(script)
          '
          lftp -f deploy.lftp
          rm -f deploy.lftp

